naftiko: 1.0.0-alpha2
info:
  label: Akri Metrics API — Metrics
  description: 'Akri Metrics API — Metrics. 1 operations. Lead operation: Akri Get Prometheus Metrics. Self-contained Naftiko
    capability covering one Akri business surface.'
  tags:
  - Akri
  - Metrics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKRI_API_KEY: AKRI_API_KEY
capability:
  consumes:
  - type: http
    namespace: metrics-metrics
    baseUri: http://localhost:8080
    description: Akri Metrics API — Metrics business capability. Self-contained, no shared references.
    resources:
    - name: metrics
      path: /metrics
      operations:
      - name: getmetrics
        method: GET
        description: Akri Get Prometheus Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: metrics-metrics-rest
    port: 8080
    description: REST adapter for Akri Metrics API — Metrics. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/metrics
      name: metrics
      description: REST surface for metrics.
      operations:
      - method: GET
        name: getmetrics
        description: Akri Get Prometheus Metrics
        call: metrics-metrics.getmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: metrics-metrics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Akri Metrics API — Metrics. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: akri-get-prometheus-metrics
      description: Akri Get Prometheus Metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metrics-metrics.getmetrics
      outputParameters:
      - type: object
        mapping: $.
